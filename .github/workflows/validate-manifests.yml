name: Validate public update manifests

on:
  push:
    branches: [main]
    paths:
      - 'barber.json'
      - 'customer.json'
      - 'manifest.schema.json'
      - '.github/workflows/validate-manifests.yml'
  pull_request:
    paths:
      - 'barber.json'
      - 'customer.json'
      - 'manifest.schema.json'
      - '.github/workflows/validate-manifests.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate each application manifest
        run: |
          python -m pip install --disable-pip-version-check jsonschema
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path("manifest.schema.json").read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          expected = {
              "barber.json": "com.barberly.barberly_barber",
              "customer.json": "com.barberly.barberly_customer",
          }
          for filename, package_id in expected.items():
              manifest = json.loads(Path(filename).read_text(encoding="utf-8"))
              errors = sorted(validator.iter_errors(manifest), key=lambda error: list(error.path))
              if errors:
                  raise SystemExit(f"{filename}: " + "; ".join(error.message for error in errors))
              if manifest.get("applicationId") not in (None, package_id):
                  raise SystemExit(f"{filename}: wrong applicationId")
              if manifest.get("enabled") is True and manifest["minimumSupportedBuildNumber"] > manifest["buildNumber"]:
                  raise SystemExit(f"{filename}: minimumSupportedBuildNumber exceeds buildNumber")
              print(f"{filename}: valid (enabled={manifest['enabled']})")
          PY
